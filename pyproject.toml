[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-fleet"
version = "0.1.0"
description = "Hands-free control plane for a fleet of coding agents — drive Claude Code / Cursor sessions running in cmux by voice or keyboard, with stable per-ship nicknames."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Tao Xie" }]
keywords = ["cmux", "claude-code", "cursor", "voice-control", "agent-orchestration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Environment :: Console",
  "Topic :: Terminals",
]
dependencies = []

[project.optional-dependencies]
repl = ["rich>=13", "prompt_toolkit>=3"]
dev = ["pytest>=8"]

[project.scripts]
agent-fleet-daemon  = "agent_fleet.daemon:main"
agent-fleet-board   = "agent_fleet.board:main"
agent-fleet-confirm = "agent_fleet.confirm:main"
agent-fleet-say     = "agent_fleet.say:main"
agent-fleet-chat    = "agent_fleet.chat:main"
agent-fleet-demo    = "agent_fleet.demo:main"

[project.urls]
Homepage = "https://github.com/TaoXieSZ/agent-fleet"
Source   = "https://github.com/TaoXieSZ/agent-fleet"
Issues   = "https://github.com/TaoXieSZ/agent-fleet/issues"

[tool.hatch.build.targets.wheel]
packages = ["agent_fleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
